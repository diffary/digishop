services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digishop
      POSTGRES_PASSWORD: digishop
      POSTGRES_DB: digishop
    ports: ["5433:5432"]  # 5432 на хосте занят postgres'ом другого проекта
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digishop"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://digishop:digishop@postgres:5432/digishop
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: uv run --no-sync celery -A app.tasks.celery_app worker --loglevel=info --without-gossip --without-mingle --without-heartbeat
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://digishop:digishop@postgres:5432/digishop
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build: ./backend
    command: uv run --no-sync celery -A app.tasks.celery_app beat --loglevel=info
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_started}

  admin:
    build: ./admin_panel
    environment:
      DATABASE_URL: postgresql://digishop:digishop@postgres:5432/digishop
      DJANGO_SECRET_KEY: dev-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
